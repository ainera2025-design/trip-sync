# Netlify turns your environment variables into env.js at deploy time, so the
# keys live in Netlify rather than in the repository.
#
# Set these in Site configuration -> Environment variables:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY

[build]
 publish = "."
 command = """
   printf 'window.TRIPSYNC_ENV={url:"%s",anonKey:"%s"};' \
     "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > env.js && \
   test -s env.js && grep -q 'supabase.co' env.js
 """

# Hash routing means every path must serve index.html.
[[redirects]]
 from = "/*"
 to = "/index.html"
 status = 200

[[headers]]
 for = "/*"
 [headers.values]
   X-Frame-Options = "DENY"
   X-Content-Type-Options = "nosniff"
   Referrer-Policy = "strict-origin-when-cross-origin"

# env.js is generated per deploy; never let a browser hold an old one.
[[headers]]
 for = "/env.js"
 [headers.values]
   Cache-Control = "no-store"
 